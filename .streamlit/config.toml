[server]
headless = true
port = 8501
# address is intentionally unset here so local `streamlit run` binds to
# localhost only. Container deployments override this via the
# STREAMLIT_SERVER_ADDRESS environment variable (see Dockerfile).
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "light"
# Defaults leave widget borders near-invisible (~1.2:1 contrast) and the
# primary button text under WCAG AA (~3.3:1). These values bring both to
# 4.5:1+ against white/fill.
primaryColor = "#C62828"
borderColor = "#757575"
showWidgetBorder = true
